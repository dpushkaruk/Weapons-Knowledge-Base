<rect x="830.1" y="493.0" width="95.80000000000001" height="16.200000000000003" fill="#ffffff" opacity="0.92"/>
<text x="878" y="505.0" font-size="12" font-weight="normal" fill="#495057" text-anchor="middle">load by alias</text>
<path d="M1245,515 L1300,515" fill="none" stroke="#495057" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="30" y="700" width="1410" height="120" rx="8" fill="#f8f9fa" stroke="#495057" stroke-width="1.5"/>
<text x="735.0" y="746.95" font-size="15" font-weight="bold" fill="#212529" text-anchor="middle">7 Monitoring and retraining loop</text>
<text x="735.0" y="769.2" font-size="13" font-weight="normal" fill="#495057" text-anchor="middle">Evidently (weekly, in Airflow) + Prometheus and Grafana: embedding drift, predicted-tag PSI, unknown-entity rate, gold F1, freshness</text>
<text x="735.0" y="786.75" font-size="13" font-weight="normal" fill="#495057" text-anchor="middle">threshold crossed → Telegram alert to the owner → retrain the tags + NER model (the KB is updated, not retrained)</text>
