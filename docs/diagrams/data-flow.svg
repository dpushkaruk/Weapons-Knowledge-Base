<text x="1200" y="138" font-size="15" font-weight="bold" fill="#212529" text-anchor="middle">3 Feature store (Feast)</text>
<rect x="990" y="160" width="200" height="100" rx="8" fill="#f8f9fa" stroke="#495057" stroke-width="1.5"/>
<text x="1090.0" y="205.725" font-size="15" font-weight="bold" fill="#212529" text-anchor="middle">offline</text>
<text x="1090.0" y="227.975" font-size="13" font-weight="normal" fill="#495057" text-anchor="middle">Parquet on MinIO</text>
<rect x="1210" y="160" width="200" height="100" rx="8" fill="#f8f9fa" stroke="#495057" stroke-width="1.5"/>
<text x="1310.0" y="205.725" font-size="15" font-weight="bold" fill="#212529" text-anchor="middle">online</text>
<text x="1310.0" y="227.975" font-size="13" font-weight="normal" fill="#495057" text-anchor="middle">PostgreSQL</text>
