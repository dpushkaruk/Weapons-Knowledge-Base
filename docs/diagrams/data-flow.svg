<text x="195.0" y="230.525" font-size="13" font-weight="normal" fill="#495057" text-anchor="middle">5 channels → MinIO raw (JSONL.gz)</text>
<rect x="500" y="110" width="330" height="170" rx="8" fill="#f8f9fa" stroke="#495057" stroke-width="1.5"/>
<text x="665.0" y="173.175" font-size="15" font-weight="bold" fill="#212529" text-anchor="middle">2 Preprocessing</text>
<text x="665.0" y="195.425" font-size="13" font-weight="normal" fill="#495057" text-anchor="middle">clean, dedup, uk/ru check</text>
<text x="665.0" y="212.97500000000002" font-size="13" font-weight="normal" fill="#495057" text-anchor="middle">e5 embeddings, alias hits</text>
<text x="665.0" y="230.525" font-size="13" font-weight="normal" fill="#495057" text-anchor="middle">(Airflow task)</text>
