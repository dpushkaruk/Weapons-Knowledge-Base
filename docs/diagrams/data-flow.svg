<text x="195.0" y="524.1999999999999" font-size="13" font-weight="normal" fill="#495057" text-anchor="middle">one XLM-R model: tags + NER heads</text>
<text x="195.0" y="541.75" font-size="13" font-weight="normal" fill="#495057" text-anchor="middle">silver (Ollama) + gold (Label Studio)</text>
<text x="195.0" y="559.3" font-size="13" font-weight="normal" fill="#495057" text-anchor="middle">time split, eval vs champion</text>
<rect x="500" y="420" width="300" height="190" rx="8" fill="#f8f9fa" stroke="#495057" stroke-width="1.5"/>
<text x="650.0" y="484.4" font-size="15" font-weight="bold" fill="#212529" text-anchor="middle">5 Registry and deploy</text>
<text x="650.0" y="506.65" font-size="13" font-weight="normal" fill="#495057" text-anchor="middle">MLflow registry</text>
<text x="650.0" y="524.1999999999999" font-size="13" font-weight="normal" fill="#495057" text-anchor="middle">metrics, data version, commit</text>
<text x="650.0" y="541.75" font-size="13" font-weight="normal" fill="#495057" text-anchor="middle">alias champion,</text>
<text x="650.0" y="559.3" font-size="13" font-weight="normal" fill="#495057" text-anchor="middle">owner approves promotion</text>
<rect x="940" y="420" width="320" height="190" rx="8" fill="#ffffff" stroke="#495057" stroke-width="1.5"/>
<text x="1100" y="448" font-size="15" font-weight="bold" fill="#212529" text-anchor="middle">6 Inference</text>
<rect x="955" y="465" width="140" height="130" rx="8" fill="#f8f9fa" stroke="#495057" stroke-width="1.5"/>
<text x="1025.0" y="502.85" font-size="13" font-weight="bold" fill="#212529" text-anchor="middle">batch, daily</text>
<text x="1025.0" y="522.425" font-size="11.5" font-weight="normal" fill="#495057" text-anchor="middle">scorer + linking</text>
<text x="1025.0" y="537.9499999999999" font-size="11.5" font-weight="normal" fill="#495057" text-anchor="middle">→ update_kb</text>
<text x="1025.0" y="553.4749999999999" font-size="11.5" font-weight="normal" fill="#495057" text-anchor="middle">(Ollama merge)</text>
<text x="1025.0" y="569.0" font-size="11.5" font-weight="normal" fill="#495057" text-anchor="middle">→ KB (pgvector)</text>
<rect x="1105" y="465" width="140" height="130" rx="8" fill="#f8f9fa" stroke="#495057" stroke-width="1.5"/>
<text x="1175.0" y="502.85" font-size="13" font-weight="bold" fill="#212529" text-anchor="middle">online</text>
<text x="1175.0" y="522.425" font-size="11.5" font-weight="normal" fill="#495057" text-anchor="middle">kb-api</text>
<text x="1175.0" y="537.9499999999999" font-size="11.5" font-weight="normal" fill="#495057" text-anchor="middle">read-only</text>
<text x="1175.0" y="553.4749999999999" font-size="11.5" font-weight="normal" fill="#495057" text-anchor="middle">search, profiles</text>
<text x="1175.0" y="569.0" font-size="11.5" font-weight="normal" fill="#495057" text-anchor="middle">p95 ≤ 500 ms</text>
